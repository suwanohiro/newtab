    <script>
        function onload() {
            setInterval(keybord, 10);
            if (localStorage.top_bk != undefined) document.getElementById("bk").style.backgroundImage = "url(" + localStorage.top_bk + ")";
            cmd("onload", 0);
        }

        function set() {
            var input = window.prompt("Command?", "");
            if (input != null) cmd(input, 1);
            else location.reload(true);
        }

        function cmd(str, num) {
            var left = document.getElementById("left");
            var right = document.getElementById("right");
            var top = document.getElementById("tops");
            if (num == 0) {
                if (localStorage.top_left != undefined) left.style.width = localStorage.top_left;
                if (localStorage.top_right != undefined) right.style.width = localStorage.top_right;
                if (localStorage.top_top != undefined) top.style.height = localStorage.top_top;
                if (localStorage.top_position != undefined) document.getElementById("bk").style.backgroundPosition = localStorage.top_position;
            }
            switch (str) {
                case "onload":
                    break;

                case "delete":
                    var input = window.prompt("削除するものを選択してください\n\n・all\n・bk\n・address", "");
                    switch (input) {
                        case "all":
                            localStorage.clear("top_bk");
                            localStorage.clear("top_left");
                            localStorage.clear("top_right");
                            localStorage.clear("top_top");
                            break;

                        case "bk":
                            localStorage.clear("top_bk");
                            break;

                        case "position":
                            localStorage.clear("top_position");
                            break;

                        case "address":
                            localStorage.clear("top_left");
                            localStorage.clear("top_right");
                            localStorage.clear("top_top");
                            break;

                        default:
                            alert("Error!");
                            break;
                    }
                    break;

                case "right":
                    right.style.width = "0%";
                    left.style.width = "50%";
                    localStorage.top_left = left.style.width;
                    localStorage.top_right = right.style.width;
                    localStorage.top_top = top.style.height;
                    break;

                case "left":
                    left.style.width = "0%";
                    right.style.width = "50%";
                    localStorage.top_left = left.style.width;
                    localStorage.top_right = right.style.width;
                    localStorage.top_top = top.style.height;
                    break;

                case "top":
                    top.style.height = "0vh";
                    localStorage.top_left = left.style.width;
                    localStorage.top_right = right.style.width;
                    localStorage.top_top = top.style.height;
                    break;

                case "bottom":
                    top.style.height = "60vh";
                    localStorage.top_left = left.style.width;
                    localStorage.top_right = right.style.width;
                    localStorage.top_top = top.style.height;
                    break;

                case "middle":
                    top.style.height = "30vh";
                    localStorage.top_left = left.style.width;
                    localStorage.top_right = right.style.width;
                    localStorage.top_top = top.style.height;
                    break;

                case "center":
                    left.style.width = "25%";
                    right.style.width = "25%";
                    localStorage.top_left = left.style.width;
                    localStorage.top_right = right.style.width;
                    localStorage.top_top = top.style.height;
                    break;

                case "中央":
                    top.style.height = "30vh";
                    left.style.width = "25%";
                    right.style.width = "25%";
                    localStorage.top_left = left.style.width;
                    localStorage.top_right = right.style.width;
                    localStorage.top_top = top.style.height;
                    break;

                case "img":
                    document.getElementById("bk").style.backgroundImage = "url(" + str + ")";
                    localStorage.top_bk = str;
                    break;

                case "position":
                    var input = window.prompt("position?", "");
                    document.getElementById("bk").style.backgroundPosition = input;
                    localStorage.top_position = input;
                    break;

                default:
                    location.reload(true);
                    break;
            }
            if (num != 0) location.reload(true);
        }

        function hyouji() {
            if (document.getElementById("main").style.display == "none") {
                document.getElementById("main").style.display = "block";
                document.getElementById("sub").style.display = "none";
            } else {
                document.getElementById("main").style.display = "none";
                document.getElementById("sub").style.display = "block";

            }

        }

        function keybord() {
            addEventListener("keydown", keydownfunc, false);
        }

        function keydownfunc(event) {
            var key_code = event.keyCode;
            switch (key_code) {
                case 191:
                    set();
                    break;

                default:
                    //alert(key_code);
                    break;
            }
        }
    </script>
