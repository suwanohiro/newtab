    <script>
        var a = 0;

        function hyouji(num) {
            if (num == 0) {
                document.getElementById("main").style.display = "block";
                document.getElementById("sub").style.display = "none";
            } else if (num == 1) {
                document.getElementById("main").style.display = "none";
                document.getElementById("sub").style.display = "block";

            }

        }

        function btn() {
            a++;
            hyouji(a % 2);
        }

    </script>
